modules:
  jira:globalPage:
    - key: controlproof-dashboard
      resource: main
      resolver:
        function: resolver
      render: native
      title: ControlProof
      icon: resource:assets;icon.svg

  rovo:agent:
    - key: controlproof-agent
      name: ControlProof Auditor
      description: Checks how audit-ready your team is for ISO 27001, SOC 2 or the
        Nigeria Data Protection Act, using evidence in Jira and Confluence.
      icon: resource:assets;icon.svg
      prompt: resource:prompts;agent.md
      conversationStarters:
        - Are we audit-ready for ISO 27001?
        - What are our biggest SOC 2 gaps?
        - Show me evidence for access reviews
        - What do we still need for NDPA compliance?
      actions:
        - get-readiness
        - list-gaps
        - find-evidence

  action:
    - key: get-readiness
      name: Get audit readiness
      function: getReadiness
      actionVerb: GET
      description: |
        Returns the overall audit-readiness score, verdict, counts of covered,
        partial, stale and missing controls, and the top gaps for a compliance
        framework, based on evidence labelled in Jira and Confluence.
      inputs:
        framework:
          title: Framework
          type: string
          required: false
          description: "Compliance framework: iso27001, soc2 or ndpa. Leave empty for the
            team's default."
    - key: list-gaps
      name: List compliance gaps
      function: listGaps
      actionVerb: GET
      description: |
        Lists controls that are missing evidence, have stale evidence, or are
        only partly evidenced, most urgent first, with the reason for each.
      inputs:
        framework:
          title: Framework
          type: string
          required: false
          description: "Compliance framework: iso27001, soc2 or ndpa."
        limit:
          title: Limit
          type: integer
          required: false
          description: "Maximum number of gaps to return (1-30, default 10)."
    - key: find-evidence
      name: Find evidence for a control
      function: findEvidence
      actionVerb: GET
      description: |
        For one control (by ID like A.5.18 or CC6.3, or by topic like
        "access reviews" or "backups"), returns its status, the evidence
        already linked, and suggested Jira issues or Confluence pages that
        look like evidence but are not linked yet.
      inputs:
        framework:
          title: Framework
          type: string
          required: false
          description: "Compliance framework: iso27001, soc2 or ndpa."
        control:
          title: Control
          type: string
          required: true
          description: "Control ID (e.g. A.5.18, CC6.3, S40) or topic (e.g. backups)."

  function:
    - key: resolver
      handler: index.handler
    - key: getReadiness
      handler: index.getReadiness
    - key: listGaps
      handler: index.listGaps
    - key: findEvidence
      handler: index.findEvidence

resources:
  - key: main
    path: src/frontend/index.jsx
  - key: assets
    path: static
  - key: prompts
    path: prompts

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:confluence-content.summary
    - read:confluence-content.all
    - search:confluence
    - write:confluence-content
    - read:space:confluence
    - write:page:confluence
    - storage:app

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/47b69b15-1c3a-4a59-a901-235cbe410fb7
